<title>NutriFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#05070A;
  --bg-2:#090D11;
  --panel:#0C1115;
  --panel-2:#11181D;
  --panel-3:#172027;
  --line:rgba(214,240,255,.075);
  --line-2:rgba(214,240,255,.13);
  --line-3:rgba(214,240,255,.2);
  --text:#E9EFF2;
  --text-2:#A2AFB6;
  --text-3:#66747C;
  --mint:#5CF0B0;
  --mint-2:#2FD08F;
  --mint-dim:rgba(92,240,176,.11);
  --mint-glow:rgba(92,240,176,.35);
  --violet:#A394FF;
  --violet-dim:rgba(163,148,255,.12);
  --sky:#6FCBFF;
  --sky-dim:rgba(111,203,255,.12);
  --amber:#FFC46B;
  --amber-dim:rgba(255,196,107,.12);
  --rose:#FF7A93;
  --rose-dim:rgba(255,122,147,.12);
  --r:14px;
  --r-sm:9px;
  --side:248px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Commissioner","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.5; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 480px at 78% -8%, rgba(92,240,176,.085), transparent 60%),
    radial-gradient(700px 420px at 22% -12%, rgba(163,148,255,.07), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(111,203,255,.035), transparent 60%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 45% at 60% 0%, #000 0%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 70% 45% at 60% 0%, #000 0%, transparent 70%);
}
h1,h2,h3,h4{margin:0; font-weight:650; text-wrap:balance; letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
::selection{background:rgba(92,240,176,.28)}
.mono{font-family:var(--mono); font-feature-settings:"zero" 0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.spacer{flex:1 1 auto}

/* ---------- shell ---------- */
#app{position:relative; z-index:1; display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100%}
#side{
  position:sticky; top:env(safe-area-inset-top,0px); height:100vh; align-self:start;
  display:flex; flex-direction:column; gap:6px; padding:18px 14px calc(16px + env(safe-area-inset-bottom,0px));
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(12,17,21,.82), rgba(7,10,13,.9));
  backdrop-filter:blur(14px);
}
.logo{display:flex; align-items:center; gap:11px; padding:2px 6px 14px}
.logo-mark{
  width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:conic-gradient(from 210deg, var(--mint), var(--sky), var(--violet), var(--mint));
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 26px -6px var(--mint-glow);
  position:relative;
}
.logo-mark::after{content:""; position:absolute; inset:1.5px; border-radius:9px; background:#07100D}
.logo-mark svg{position:relative; z-index:1; width:19px; height:19px}
.logo b{display:block; font-size:16.5px; font-weight:750; letter-spacing:-.02em}
.logo small{display:block; font-size:11px; color:var(--text-3); margin-top:1px}
.cmdk-btn{
  display:flex; align-items:center; gap:9px; width:100%; margin-bottom:10px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  color:var(--text-3); cursor:pointer; font-size:13px; text-align:start;
}
.cmdk-btn:hover{border-color:var(--line-2); color:var(--text-2)}
.cmdk-btn svg{width:15px; height:15px}
kbd{
  font-family:var(--mono); font-size:10.5px; color:var(--text-3); background:rgba(255,255,255,.04);
  border:1px solid var(--line-2); border-bottom-width:2px; border-radius:5px; padding:0 5px; line-height:17px; display:inline-block
}
.nav-label{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); padding:10px 10px 4px; font-family:var(--mono)}
.nav{
  display:flex; align-items:center; gap:11px; width:100%; background:none; border:0; border-radius:9px;
  padding:8px 10px; color:var(--text-2); cursor:pointer; font-weight:500; text-align:start; position:relative;
}
.nav svg{width:17px; height:17px; flex:none; opacity:.85}
.nav:hover{background:rgba(255,255,255,.035); color:var(--text)}
.nav[aria-current="true"]{background:linear-gradient(90deg, rgba(92,240,176,.12), rgba(92,240,176,.02)); color:var(--text)}
.nav[aria-current="true"] svg{color:var(--mint); opacity:1; filter:drop-shadow(0 0 6px var(--mint-glow))}
.nav .badge{margin-inline-start:auto; font-family:var(--mono); font-size:11px; color:var(--text-3)}
.nav[aria-current="true"] .badge{color:var(--mint)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.sync{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-3); padding:0 10px; font-family:var(--mono)}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 10px var(--mint)}
.sync.off i{background:var(--amber); box-shadow:0 0 10px var(--amber)}
.me{display:flex; align-items:center; gap:10px; padding:10px; border-radius:11px; background:var(--panel-2); border:1px solid var(--line)}
.me img{width:30px; height:30px; border-radius:50%; flex:none}
.me b{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.me span{font-size:11.5px; color:var(--text-3)}

#main{min-width:0; display:flex; flex-direction:column}
#top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:12px; padding:14px 28px;
  background:linear-gradient(180deg, rgba(5,7,10,.92), rgba(5,7,10,.72));
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-3); min-width:0}
.crumbs b{color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumbs button{background:none; border:0; color:var(--text-3); cursor:pointer; padding:0}
.crumbs button:hover{color:var(--text)}
#view{padding:26px 28px 80px; width:100%; max-width:1320px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap;
  height:34px; padding:0 13px; border-radius:9px; cursor:pointer; font-weight:550; font-size:13px;
  background:var(--panel-2); color:var(--text); border:1px solid var(--line-2);
  transition:border-color .15s, background .15s, transform .08s, box-shadow .15s;
}
.btn:hover{border-color:var(--line-3); background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px; height:15px; flex:none}
.btn.pri{background:var(--mint); color:#04150E; border-color:transparent; box-shadow:0 0 0 1px rgba(92,240,176,.4), 0 8px 26px -8px var(--mint-glow)}
.btn.pri:hover{background:#7AF6C2; box-shadow:0 0 0 1px rgba(92,240,176,.55), 0 10px 30px -8px var(--mint-glow)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04); color:var(--text)}
.btn.danger{color:var(--rose)}
.btn.danger:hover{border-color:rgba(255,122,147,.45); background:var(--rose-dim)}
.btn.sm{height:28px; padding:0 10px; font-size:12.5px; border-radius:8px}
.btn.icon{width:34px; padding:0}
.btn.sm.icon{width:28px}
.btn[disabled]{opacity:.45; pointer-events:none}
:focus-visible{outline:2px solid var(--mint); outline-offset:2px; border-radius:6px}

.card{
  position:relative; border-radius:var(--r); border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,.008)), var(--panel);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -30px rgba(0,0,0,.8);
}
.card.hover{transition:border-color .18s, transform .18s}
.card.hover:hover{border-color:var(--line-3)}
.card-h{display:flex; align-items:center; gap:10px; padding:15px 18px 0; flex-wrap:wrap; row-gap:8px}
.card-h h3{font-size:14px; font-weight:600; letter-spacing:-.005em}
.card-h .sub{font-size:12px; color:var(--text-3)}
.card-b{padding:16px 18px 18px}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--text-3)}

.chip{
  display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:6px;
  font-size:11.5px; font-weight:550; white-space:nowrap; background:rgba(255,255,255,.05); color:var(--text-2);
  border:1px solid var(--line);
}
.chip i{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.mint{background:var(--mint-dim); color:var(--mint); border-color:rgba(92,240,176,.18)}
.chip.violet{background:var(--violet-dim); color:var(--violet); border-color:rgba(163,148,255,.2)}
.chip.sky{background:var(--sky-dim); color:var(--sky); border-color:rgba(111,203,255,.2)}
.chip.amber{background:var(--amber-dim); color:var(--amber); border-color:rgba(255,196,107,.2)}
.chip.rose{background:var(--rose-dim); color:var(--rose); border-color:rgba(255,122,147,.22)}
.chip.glow i{box-shadow:0 0 8px currentColor}

.av{
  width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:12px; font-weight:700; letter-spacing:.02em; color:#061015; position:relative;
}
.av.sm{width:28px; height:28px; font-size:10.5px}
.av.lg{width:64px; height:64px; font-size:21px}
.av.lg::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:1px solid var(--line-2)}

.grid{display:grid; gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s-8{grid-column:span 8} .s-7{grid-column:span 7} .s-6{grid-column:span 6} .s-5{grid-column:span 5} .s-4{grid-column:span 4} .s-12{grid-column:span 12}
.row{display:flex; align-items:center; gap:10px}
.col{display:flex; flex-direction:column; gap:10px}
.wrap{flex-wrap:wrap}

/* KPI */
.kpi{padding:16px 18px 14px; overflow:hidden}
.kpi .k-top{display:flex; align-items:center; gap:8px}
.kpi .k-val{font-size:30px; font-weight:700; letter-spacing:-.035em; line-height:1.1; margin-top:12px; font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:15px; font-weight:600; color:var(--text-3); letter-spacing:0; margin-inline-start:2px}
.kpi .k-meta{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--text-3)}
.kpi svg.spark{position:absolute; right:14px; bottom:14px; width:110px; height:38px}
.kpi.has-spark .k-meta{padding-right:118px}
.delta{font-family:var(--mono); font-size:11.5px; font-weight:600}
.delta.up{color:var(--mint)} .delta.down{color:var(--rose)}

/* timeline */
.tl{position:relative; padding:6px 18px 12px}
.tl-item{display:grid; grid-template-columns:52px 22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; position:relative}
.tl-item::before{content:""; position:absolute; left:73px; top:0; bottom:0; width:1px; background:var(--line)}
.tl-item:first-child::before{top:50%} .tl-item:last-child::before{bottom:50%}
.tl-time{font-family:var(--mono); font-size:12.5px; color:var(--text-2); text-align:end}
.tl-dot{width:11px; height:11px; border-radius:50%; justify-self:center; position:relative; z-index:1; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--line-2)}
.tl-body{display:flex; align-items:center; gap:10px; min-width:0; padding:8px 10px; border-radius:10px; cursor:pointer; border:1px solid transparent}
.tl-body:hover{background:rgba(255,255,255,.03); border-color:var(--line)}
.tl-body b{display:block; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tl-body span{font-size:12px; color:var(--text-3)}
.tl-item.next .tl-body{background:var(--mint-dim); border-color:rgba(92,240,176,.2)}
.tl-now{display:grid; grid-template-columns:52px 22px 1fr; gap:10px; align-items:center; margin:2px 0}
.tl-now span{font-family:var(--mono); font-size:10.5px; color:var(--rose); text-align:end; letter-spacing:.08em}
.tl-now i{width:9px; height:9px; border-radius:50%; background:var(--rose); justify-self:center; box-shadow:0 0 10px var(--rose)}
.tl-now hr{border:0; height:1px; background:linear-gradient(90deg, var(--rose), transparent); margin:0}
.qa{display:flex; gap:4px}

/* alerts */
.al{display:flex; align-items:center; gap:12px; padding:11px 18px; border-top:1px solid var(--line); cursor:pointer}
.al:first-child{border-top:0}
.al:hover{background:rgba(255,255,255,.02)}
.al .ico{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none}
.al .ico svg{width:15px; height:15px}
.al b{display:block; font-size:13px; font-weight:600}
.al span{font-size:12px; color:var(--text-3)}

/* table */
.tw{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3); font-weight:500; text-align:start; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.022)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
.r{text-align:end}
.cname b{display:block; font-weight:600; white-space:nowrap}
.cname span{font-size:12px; color:var(--text-3)}

.bar{height:6px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden; position:relative}
.bar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px}

/* filter chips */
.filters{display:flex; gap:6px; flex-wrap:wrap}
.fchip{height:30px; padding:0 12px; border-radius:99px; background:transparent; border:1px solid var(--line-2); color:var(--text-2); cursor:pointer; font-size:12.5px; font-weight:550; display:inline-flex; align-items:center; gap:7px}
.fchip:hover{border-color:var(--line-3); color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--text); color:#06090B; border-color:var(--text)}
.fchip .n{font-family:var(--mono); font-size:11px; opacity:.7}

.search{display:flex; align-items:center; gap:8px; height:34px; padding:0 11px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line-2); min-width:220px}
.search svg{width:15px; height:15px; color:var(--text-3); flex:none}
.search input{background:none; border:0; outline:none; width:100%; font-size:13px}

/* tabs */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:22px 0 20px; overflow-x:auto}
.tab{background:none; border:0; padding:10px 12px; cursor:pointer; color:var(--text-3); font-weight:550; position:relative; white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; border-radius:2px; background:var(--mint); box-shadow:0 0 12px var(--mint-glow)}
.seg{max-width:100%; overflow-x:auto; display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px}
.seg button{height:26px; padding:0 10px; border-radius:6px; border:0; background:none; color:var(--text-3); cursor:pointer; font-size:12px; font-weight:600}
.seg button[aria-pressed="true"]{background:var(--panel-3); color:var(--text); box-shadow:0 0 0 1px var(--line-2)}

/* client hero */
.hero{padding:22px 22px 20px; overflow:hidden}
.hero::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(600px 200px at 0% 0%, var(--hero-tint, rgba(92,240,176,.09)), transparent 70%)}
.hero-top{display:flex; gap:18px; align-items:center; flex-wrap:wrap; position:relative}
.hero h1{font-size:26px; font-weight:750; letter-spacing:-.03em}
.stats{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:0; margin-top:22px; border-top:1px solid var(--line); position:relative}
.stat{padding:16px 16px 2px; border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0; padding-inline-start:0}
.stat .v{font-size:22px; font-weight:700; letter-spacing:-.03em; margin-top:6px; font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px; color:var(--text-3); font-weight:600; letter-spacing:0}
.stat .m{font-size:12px; color:var(--text-3); margin-top:2px}
.copy{background:none; border:0; color:var(--text-2); cursor:pointer; padding:2px 4px; border-radius:6px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px}
.copy:hover{color:var(--text); background:rgba(255,255,255,.05)}
.copy svg{width:13px; height:13px; color:var(--text-3)}

/* feed */
.feed-i{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; padding:10px 0; position:relative}
.feed-i::before{content:""; position:absolute; left:13.5px; top:34px; bottom:-10px; width:1px; background:var(--line)}
.feed-i:last-child::before{display:none}
.feed-i .fi{width:28px; height:28px; border-radius:8px; display:grid; place-items:center}
.feed-i .fi svg{width:14px; height:14px}
.feed-i b{font-size:13px; font-weight:600}
.feed-i span{font-size:12px; color:var(--text-3)}

/* calendar */
.cal-wrap{overflow-x:auto}
.cal{display:grid; min-width:780px}
.cal-head{display:grid; position:sticky; top:0}
.cal-dh{padding:12px 10px; border-bottom:1px solid var(--line); border-inline-start:1px solid var(--line)}
.cal-dh b{font-size:20px; font-weight:700; letter-spacing:-.03em}
.cal-dh.today b{color:var(--mint); text-shadow:0 0 18px var(--mint-glow)}
.cal-body{display:grid; position:relative}
.cal-hours div{height:var(--hh); font-family:var(--mono); font-size:10.5px; color:var(--text-3); text-align:end; padding-inline-end:10px; transform:translateY(-7px)}
.cal-col{position:relative; border-inline-start:1px solid var(--line); cursor:copy;
  background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% var(--hh)}
.cal-col.today{background-color:rgba(92,240,176,.018)}
.cal-col.break::before{content:""; position:absolute; left:0; right:0; top:var(--bt); height:var(--bh); background:repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 6px, transparent 6px 12px); pointer-events:none}
.ev{
  position:absolute; left:4px; right:4px; border-radius:8px; padding:5px 8px; overflow:hidden; cursor:pointer;
  border:1px solid; font-size:11.5px; line-height:1.3; transition:transform .12s, box-shadow .12s;
}
.ev:hover{transform:translateY(-1px); z-index:3; box-shadow:0 10px 24px -10px rgba(0,0,0,.9)}
.ev-l{display:flex; align-items:baseline; gap:6px; min-width:0}
.ev b{font-weight:650; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.ev .t{font-family:var(--mono); font-size:10.5px; opacity:.85; flex:none}
.ev .ty{display:block; font-size:10.5px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px}
.ev.short{padding:3px 7px; display:flex; align-items:center}
.ev.done{opacity:.55}
.ev.noshow{background-image:repeating-linear-gradient(135deg, rgba(255,122,147,.14) 0 5px, transparent 5px 10px) !important}
.ev.cancelled{opacity:.3; text-decoration:line-through}
.nowline{position:absolute; left:-1px; right:0; height:2px; background:var(--rose); box-shadow:0 0 12px var(--rose); z-index:4; pointer-events:none}
.nowline::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--rose)}

.mini-in{background:var(--panel-2); border:1px solid var(--line-2); border-radius:7px; padding:4px 6px; font-family:var(--mono); font-size:11.5px; text-align:end; width:100%; outline:none}
.pb-side{position:sticky; top:84px; display:flex; flex-direction:column; gap:14px}

.food .plus{margin-inline-start:auto; width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:var(--mint-dim); color:var(--mint); flex:none; opacity:0; transition:opacity .12s}

/* forms */
.fields{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}

}

/* overlay / sheet */

.sheet{width:min(640px,100%); border-radius:16px; border:1px solid var(--line-2); background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel); box-shadow:0 40px 90px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset; animation:pop .18s cubic-bezier(.2,.9,.3,1.2); margin-bottom:auto}

async function pinHash(pin){

      kpi('Κέρδος ' + MONG[cur.getMonth()], EUR.format(rev - expM), '', (rev ? Math.round((rev - expM) / rev * 100) + '% περιθώριο · ' : '') + EUR.format(owed) + ' προς είσπραξη', '', 'trend', rev - expM >= 0 ? 'amber' : 'rose')) +

}
function kpi(label, val, unit, meta, sparkHtml, icon, color){

function timeline(list, now, nxt){
  let out = '', nowDone = false;
  list.forEach(a => {
    if(now != null && !nowDone && tmin(a.time) > now){ out += nowRow(now); nowDone = true; }
    const c = client(a.clientId) || {name:'—'};
    const tc = TYPE_C[a.type] || 'mint';
    const st = STATUS[a.status] || STATUS.scheduled;
    const past = now != null && a.status === 'scheduled' && tmin(a.time) + (a.duration || 45) <= now;
    const pk = a.packageId ? S.packages.find(p => p.id === a.packageId) : null;
    out += '<div class="tl-item' + (nxt && nxt.id === a.id ? ' next' : '') + '">' +
      '<span class="tl-time">' + esc(a.time) + '</span>' +
      '<span class="tl-dot" style="background:' + (a.status === 'done' ? 'var(--mint)' : a.status === 'noshow' ? 'var(--rose)' : COLORS[tc]) + ';' + (nxt && nxt.id === a.id ? 'box-shadow:0 0 0 1px var(--mint),0 0 12px var(--mint)' : '') + '"></span>' +
      '<div class="tl-body" data-act="appt" data-id="' + a.id + '">' + av(c.name, 'sm') +
        '<span style="min-width:0;flex:1"><b>' + esc(c.name) + '</b><span>' + esc(a.type) + ' · ' + (a.duration || 45) + '′' + (pk ? ' · ' + esc(shortPkg(pk)) + ' ' + (pkgUsed(pk) + (a.status === 'scheduled' ? 1 : 0)) + '/' + pk.sessions : a.fee ? ' · ' + EUR.format(a.fee) : '') + '</span></span>' +
      '</div>' +
      (a.status === 'scheduled' && S.canWrite ? '<div class="qa">' +
          '<button class="btn sm icon" data-act="status" data-id="' + a.id + '" data-s="done" title="Ολοκληρώθηκε" aria-label="Ολοκληρώθηκε" style="' + (past ? 'border-color:rgba(92,240,176,.5);color:var(--mint)' : '') + '">' + ic('check') + '</button>' +
          '<button class="btn sm icon" data-act="status" data-id="' + a.id + '" data-s="noshow" title="Δεν προσήλθε" aria-label="Δεν προσήλθε">' + ic('x') + '</button></div>'
        : chip(st.l, st.c, true)) +
    '</div>';
  });
  if(now != null && !nowDone) out += nowRow(now);
  return out;
}
function nowRow(now){ return '<div class="tl-now"><span>ΤΩΡΑ ' + tstr(now) + '</span><i></i><hr></div>'; }
function shortPkg(p){ return /online/i.test(p.name) ? 'Online' : 'Πακέτο'; }
function resultsCard(){
  const loss = S.clients.filter(c => c.status !== 'inactive').map(c => ({c, p:progress(c)})).filter(x => x.p);
  const lost = sum(loss.filter(x => x.p.d < 0 && (x.c.goal === 'Απώλεια βάρους' || x.c.goal === 'Παθολογική διατροφή')), x => -x.p.d);

}

function clientRows(){
  const q = S.q.trim().toLowerCase();
  const t = today();
  let list = S.clients.slice();
  const F = {
    all: () => true,
    active: c => c.status !== 'inactive',
    debt: c => balance(c.id) > 0,
    nonext: c => c.status !== 'inactive' && !nextA(c.id),
    inactive: c => c.status === 'inactive'
  };
  const counts = {}; Object.keys(F).forEach(k => counts[k] = list.filter(F[k]).length);
  list = list.filter(F[S.filter] || F.all);
  if(q) list = list.filter(c => (c.name || '').toLowerCase().includes(q) || (c.phone || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')) || (c.email || '').toLowerCase().includes(q) || (c.goal || '').toLowerCase().includes(q) || (c.tags || []).join(' ').toLowerCase().includes(q));
  const S_ = {
    name: (a, b) => a.name.localeCompare(b.name, 'el'),
    progress: (a, b) => ((progress(b) || {}).pct || 0) - ((progress(a) || {}).pct || 0),
    recent: (a, b) => String(lastVisit(b.id)).localeCompare(String(lastVisit(a.id))),
    balance: (a, b) => balance(b.id) - balance(a.id)
  };
  list.sort(S_[S.sort] || S_.name);
  return {list, counts};
}

const H0 = 8, H1 = 21, HH = 64;
function vCalendar(){
  const ws = S.week, t = today();
  const days = []; for(let i = 0; i < 7; i++) days.push(addD(ws, i));
  const inWeek = S.appointments.filter(a => a.date >= ws && a.date < addD(ws, 7));
  const showSun = inWeek.some(a => a.date === days[6]);
  const vis = showSun ? days : days.slice(0, 6);
  const cols = '56px repeat(' + vis.length + ', minmax(0,1fr))';
  const booked = inWeek.filter(a => a.status !== 'cancelled');
  const mins = sum(booked, a => a.duration || 45);
  const d0 = P(ws), d1 = P(addD(ws, 6));
  const label = d0.getDate() + (d0.getMonth() !== d1.getMonth() ? ' ' + MON[d0.getMonth()] : '') + ' – ' + d1.getDate() + ' ' + MON[d1.getMonth()] + ' ' + d1.getFullYear();
  const now = nowMin();
  const hours = []; for(let h = H0; h < H1; h++) hours.push(h);

  const grid = '<div class="cal" style="grid-template-columns:' + cols + ';--hh:' + HH + 'px">' +
    '<div></div>' + vis.map(d => '<div class="cal-dh' + (d === t ? ' today' : '') + '"><div class="eyebrow">' + DAYS[P(d).getDay()] + '</div><b>' + P(d).getDate() + '</b> <span class="faint mono" style="font-size:11px">' + inWeek.filter(a => a.date === d && a.status !== 'cancelled').length + ' ραντ.</span></div>').join('') +
    '<div class="cal-hours" style="padding-top:0">' + hours.map(h => '<div>' + String(h).padStart(2, '0') + ':00</div>').join('') + '</div>' +
    vis.map(d => {
      const sat = P(d).getDay() === 6;
      const brk = sat ? '' : ' break';
      const bt = (14 - H0) * HH, bh = 3 * HH;
      const evs = inWeek.filter(a => a.date === d).sort((a, b) => a.time < b.time ? -1 : 1).map(a => {
        const c = client(a.clientId) || {name:'—'};
        const top = (tmin(a.time) - H0 * 60) / 60 * HH, h = Math.max(22, (a.duration || 45) / 60 * HH - 3);
        const tc = TYPE_C[a.type] || 'mint';
        return '<div class="ev ' + a.status + (h < 40 ? ' short' : '') + '" data-act="appt" data-id="' + a.id + '" title="' + esc(a.time + ' · ' + c.name + ' · ' + a.type) + '" style="top:' + top.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px;background:var(--' + tc + '-dim);border-color:color-mix(in srgb, ' + COLORS[tc] + ' 38%, transparent);color:' + COLORS[tc] + '">' +
          '<div style="min-width:0;width:100%"><div class="ev-l"><span class="t">' + esc(a.time) + (a.status === 'done' ? ' ✓' : a.status === 'noshow' ? ' ✕' : '') + '</span><b style="color:var(--text)">' + esc(c.name) + '</b></div>' + (h >= 40 ? '<span class="ty">' + esc(a.type) + '</span>' : '') + '</div></div>';
      }).join('');
      const nl = d === t && now >= H0 * 60 && now <= H1 * 60 ? '<div class="nowline" style="top:' + ((now - H0 * 60) / 60 * HH).toFixed(1) + 'px"></div>' : '';
      return '<div class="cal-col' + (d === t ? ' today' : '') + brk + '" data-act="slot" data-d="' + d + '" style="height:' + ((H1 - H0) * HH) + 'px;--bt:' + bt + 'px;--bh:' + bh + 'px">' + evs + nl + '</div>';
    }).join('') + '</div>';

  const dayList = S.appointments.filter(a => a.date === S.calDay && a.status !== 'cancelled').sort((a, b) => a.time < b.time ? -1 : 1);
  const mobile = '<div class="daystrip">' + vis.map(d => '<button data-act="calday" data-d="' + d + '" aria-pressed="' + (S.calDay === d) + '"><span>' + DAYS[P(d).getDay()] + '</span><b>' + P(d).getDate() + '</b></button>').join('') + '</div>' +
    '<div class="only-sm" style="margin-top:12px">' + (dayList.length ? '<section class="card"><div class="tl">' + timeline(dayList, S.calDay === t ? now : null, null) + '</div></section>' : '<section class="card">' + empty('cal', 'Κανένα ραντεβού', fmtL(S.calDay)) + '</section>') + '</div>';

  return '<div class="row wrap" style="margin-bottom:16px;gap:10px">' +
      '<div class="row" style="gap:6px"><button class="btn icon" data-act="week" data-n="-1" aria-label="Προηγούμενη εβδομάδα">' + ic('chevL') + '</button><button class="btn" data-act="week" data-n="0">Σήμερα</button><button class="btn icon" data-act="week" data-n="1" aria-label="Επόμενη εβδομάδα">' + ic('chevR') + '</button></div>' +
      '<h2 style="font-size:18px;font-weight:700;letter-spacing:-.02em">' + label + '</h2>' +
      '<span class="spacer"></span>' +
      '<div class="legend hide-sm">' + TYPES.map(tp => '<span><i style="background:' + COLORS[TYPE_C[tp]] + '"></i>' + tp + '</span>').join('') + '</div>' +
      chip(booked.length + ' ραντεβού · ' + N1.format(mins / 60) + ' ώρες', 'mint') +
    '</div>' +
    '<section class="card cal-wrap" style="padding:0 0 8px">' + grid + '</section>' + mobile +
    '<p class="faint hide-sm" style="font-size:12px;margin-top:10px">Κλικ σε κενό σημείο για νέο ραντεβού · διαγραμμισμένη ζώνη: μεσημεριανό διάλειμμα 14:00–17:00</p>';
}

function vPlans(){
  const tpl = S.ptab === 'tpl';
  const ps = S.plans.filter(p => tpl ? p.isTemplate : !p.isTemplate).sort((a, b) => a.date < b.date ? 1 : -1);
  return '<div class="row wrap" style="margin-bottom:16px;gap:10px"><div class="seg">' +
      '<button data-act="ptab" data-t="client" aria-pressed="' + !tpl + '">Πλάνα πελατών · ' + S.plans.filter(p => !p.isTemplate).length + '</button>' +
      '<button data-act="ptab" data-t="tpl" aria-pressed="' + tpl + '">Πρότυπα · ' + S.plans.filter(p => p.isTemplate).length + '</button></div>' +
      '<span class="spacer"></span><span class="faint" style="font-size:12.5px">' + FOODS.length + ' τρόφιμα στη βάση</span></div>' +
    (ps.length ? '<div class="grid g-3">' + ps.map(p => planCard(p, !tpl)).join('') + '</div>' :
      '<section class="card">' + empty('plan', tpl ? 'Κανένα πρότυπο' : 'Κανένα πλάνο', tpl ? 'Αποθηκεύστε ένα πλάνο ως πρότυπο για να το ξαναχρησιμοποιείτε.' : 'Δημιουργήστε το πρώτο διατροφικό πλάνο.') + '</section>');
}
function planCard(p, showClient){
  const t = planTot(p), c = client(p.clientId), dev = p.targetKcal ? t.k - p.targetKcal : null;
  const kp = t.p * 4, kc = t.c * 4, kf = t.f * 9, kt = kp + kc + kf || 1;
  return '<section class="card hover" data-act="edit-plan" data-id="' + p.id + '" style="cursor:pointer;display:flex;flex-direction:column">' +
    '<div class="card-h" style="align-items:flex-start"><div style="min-width:0;flex:1"><h3 style="font-size:15px">' + esc(p.title) + '</h3>' +
      '<div class="faint" style="font-size:12px;margin-top:2px">' + (showClient && c ? esc(c.name) + ' · ' : p.isTemplate ? 'Πρότυπο · ' : '') + fmtD(p.date) + '</div></div>' +
      (p.isTemplate ? chip('Πρότυπο', 'violet') : '') + '</div>' +
    '<div class="card-b row" style="gap:16px;padding-top:14px">' +
      donut([{v:kp, color:'var(--mint)', l:'Πρωτεΐνη'}, {v:kc, color:'var(--sky)', l:'Υδατάνθρακες'}, {v:kf, color:'var(--violet)', l:'Λίπος'}], 92,
        '<div><div style="font-size:16px;font-weight:750;letter-spacing:-.02em">' + N0.format(t.k) + '</div><div class="eyebrow" style="font-size:8.5px">kcal</div></div>') +
      '<div class="col" style="gap:5px;flex:1;font-size:12px">' +
        '<div class="row"><i style="width:7px;height:7px;border-radius:2px;background:var(--mint)"></i><span class="muted">Π</span><span class="spacer"></span><b class="num">' + t.p + ' g</b><span class="faint mono" style="width:34px;text-align:end;font-size:10.5px">' + Math.round(kp / kt * 100) + '%</span></div>' +
        '<div class="row"><i style="width:7px;height:7px;border-radius:2px;background:var(--sky)"></i><span class="muted">Υ</span><span class="spacer"></span><b class="num">' + t.c + ' g</b><span class="faint mono" style="width:34px;text-align:end;font-size:10.5px">' + Math.round(kc / kt * 100) + '%</span></div>' +
        '<div class="row"><i style="width:7px;height:7px;border-radius:2px;background:var(--violet)"></i><span class="muted">Λ</span><span class="spacer"></span><b class="num">' + t.f + ' g</b><span class="faint mono" style="width:34px;text-align:end;font-size:10.5px">' + Math.round(kf / kt * 100) + '%</span></div>' +
      '</div></div>' +
    '<div style="padding:0 18px 16px;margin-top:auto" class="row wrap">' + (dev != null ? chip('στόχος ' + N0.format(p.targetKcal) + ' · ' + (dev > 0 ? '+' : '') + dev, Math.abs(dev) <= 80 ? 'mint' : 'amber') : '') +
      '<span class="faint" style="font-size:12px">' + (p.meals || []).filter(m => (m.items || []).length).length + ' γεύματα · ' + sum(p.meals || [], m => (m.items || []).length) + ' τρόφιμα</span></div>' +
  '</section>';
}

/* ---------------- Οικονομικά ---------------- */
function vFinance(){
  const t = today(), cur = P(t);
  const months = revenueBy(monthsBack(S.finRange));
  const m12 = revenueBy(monthsBack(12));
  const rev = m12[11].v, prev = m12[10].v, dRev = prev ? Math.round((rev - prev) / prev * 100) : null;
  const ytd = sum(S.payments.filter(p => String(p.date).startsWith(String(cur.getFullYear()))), p => p.amount);
  const doneYTD = S.appointments.filter(a => a.status === 'done' && a.date.slice(0, 7) === t.slice(0, 7)).length;
  const debt = S.clients.map(c => ({c, b:balance(c.id)})).filter(x => x.b > 0).sort((a, b) => b.b - a.b);
  const owed = sum(debt, x => x.b);
  const act = S.packages.filter(p => pkgUsed(p) < p.sessions && (client(p.clientId) || {}).status !== 'inactive').sort((a, b) => (pkgUsed(b) / b.sessions) - (pkgUsed(a) / a.sessions));
  const last90 = S.payments.filter(p => ddiff(p.date, t) <= 90);
  const byM = {}; last90.forEach(p => byM[p.method || '—'] = (byM[p.method || '—'] || 0) + (+p.amount || 0));
  const mTot = sum(Object.values(byM)) || 1;
  const q = S.paySearch.trim().toLowerCase();
  const rows = S.payments.slice().sort((a, b) => a.date < b.date ? 1 : -1).filter(p => !q || ((client(p.clientId) || {}).name || '').toLowerCase().includes(q) || (p.note || '').toLowerCase().includes(q) || (p.method || '').toLowerCase().includes(q)).slice(0, 40);

  return '<div class="grid g-4" style="margin-bottom:16px">' +
      kpi('Έσοδα ' + MONG[cur.getMonth()], EUR.format(rev), '', dRev == null ? '' : '<span class="delta ' + (dRev >= 0 ? 'up' : 'down') + '">' + (dRev >= 0 ? '▲' : '▼') + ' ' + Math.abs(dRev) + '%</span> από ' + MON[(cur.getMonth() + 11) % 12], spark(m12.slice(-6).map(m => m.v), '#5CF0B0'), 'euro', 'mint') +
      kpi('Έσοδα ' + cur.getFullYear(), EUR.format(ytd), '', 'από 1 Ιανουαρίου', '', 'trend', 'sky') +
      kpi('Συνεδρίες μήνα', doneYTD, '', doneYTD ? '≈ ' + EUR.format(rev / doneYTD) + ' ανά συνεδρία' : '—', '', 'cal', 'violet') +
      kpi('Προς είσπραξη', EUR.format(owed), '', debt.length + ' πελάτες', '', 'wallet', 'rose') +
    '</div>' +
    '<div class="grid g-12" style="margin-bottom:16px">' +
      '<section class="card s-8"><div class="card-h"><h3>Εισπράξεις ανά μήνα</h3><span class="spacer"></span><div class="seg">' + [6, 12].map(n => '<button data-act="fin" data-n="' + n + '" aria-pressed="' + (S.finRange === n) + '">' + n + ' μήνες</button>').join('') + '</div></div>' +
        '<div class="card-b">' + bars(months.map(m => ({l:m.l, v:m.v, tip:MONN[m.m] + ' ' + m.y + '|' + EUR.format(m.v)})), {fmtY:v => v >= 1000 ? N1.format(v / 1000) + 'k' : Math.round(v), label:'Εισπράξεις ανά μήνα', h:250}) + '</div></section>' +
      '<section class="card s-4"><div class="card-h"><h3>Τρόποι πληρωμής</h3><span class="sub">90 ημέρες</span></div><div class="card-b">' +
        '<div class="row" style="justify-content:center;margin:4px 0 16px">' + donut(Object.keys(byM).map(k => ({v:byM[k], color:METHOD_C[k] || 'var(--text-3)', l:k})), 138, '<div><div style="font-size:19px;font-weight:750;letter-spacing:-.02em">' + EUR.format(mTot) + '</div><div class="eyebrow" style="font-size:9px">σύνολο</div></div>') + '</div>' +
        '<div class="col" style="gap:9px">' + Object.keys(byM).sort((a, b) => byM[b] - byM[a]).map(k => '<div class="row" style="font-size:12.5px"><i style="width:8px;height:8px;border-radius:3px;background:' + (METHOD_C[k] || 'var(--text-3)') + '"></i><span class="muted">' + esc(k) + '</span><span class="spacer"></span><b class="num">' + EUR.format(byM[k]) + '</b><span class="faint mono" style="width:40px;text-align:end;font-size:11px">' + Math.round(byM[k] / mTot * 100) + '%</span></div>').join('') + '</div>' +
      '</div></section>' +
    '</div>' +
    '<div class="grid g-12" style="margin-bottom:16px">' +
      '<section class="card s-6"><div class="card-h"><h3>Ενεργά πακέτα</h3><span class="sub">' + act.length + '</span></div><div class="card-b col" style="gap:13px;max-height:390px;overflow-y:auto">' +
        (act.length ? act.map(p => { const c = client(p.clientId) || {name:'—'}, u = pkgUsed(p), left = p.sessions - u; return '<div class="row" data-act="open" data-id="' + p.clientId + '" style="cursor:pointer">' + av(c.name, 'sm') +
          '<div style="flex:1;min-width:0"><div class="row" style="font-size:12.5px;gap:6px"><b style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(c.name) + '</b><span class="faint" style="white-space:nowrap">' + esc(shortPkg(p)) + ' ' + p.sessions + '</span><span class="spacer"></span><span class="mono" style="font-size:11.5px;color:' + (left <= 1 ? 'var(--amber)' : 'var(--text-2)') + '">' + u + '/' + p.sessions + '</span></div>' +
          '<div style="margin-top:6px">' + pbar(u / p.sessions, left <= 1 ? 'var(--amber)' : 'var(--mint)') + '</div></div></div>'; }).join('') : empty('box', 'Κανένα ενεργό πακέτο', '')) +
      '</div></section>' +
      '<section class="card s-6"><div class="card-h"><h3>Οφειλές</h3><span class="sub">' + EUR.format(owed) + '</span></div><div style="padding-top:8px;max-height:398px;overflow-y:auto">' +
        (debt.length ? debt.map(x => '<div class="al" data-act="open" data-id="' + x.c.id + '">' + av(x.c.name, 'sm') + '<span style="min-width:0"><b>' + esc(x.c.name) + '</b><span>τελευταία πληρωμή ' + (pays(x.c.id)[0] ? fmtS(pays(x.c.id)[0].date) : '—') + '</span></span><span class="spacer"></span>' + chip(EUR.format(x.b), 'rose') +
          (S.canWrite ? '<button class="btn sm" data-act="new-pay" data-cid="' + x.c.id + '">Είσπραξη</button>' : '') + '</div>').join('') : empty('check', 'Καμία οφειλή', 'Όλοι οι πελάτες είναι εξοφλημένοι.')) +
      '</div></section>' +
    '</div>' +
    '<section class="card"><div class="card-h"><h3>Κινήσεις</h3><span class="spacer"></span><label class="search" style="min-width:200px">' + ic('search') + '<input id="payq" type="text" placeholder="Πελάτης, περιγραφή…" value="' + esc(S.paySearch) + '" aria-label="Αναζήτηση κινήσεων"></label></div>' +
      '<div class="tw" style="margin-top:12px"><table><thead><tr><th>Ημερομηνία</th><th>Πελάτης</th><th class="hide-sm">Περιγραφή</th><th>Τρόπος</th><th class="r">Ποσό</th></tr></thead><tbody>' +
      (rows.length ? rows.map(p => { const c = client(p.clientId) || {name:'—'}; return '<tr class="click" data-act="open" data-id="' + p.clientId + '"><td class="mono" style="font-size:12.5px;white-space:nowrap">' + fmtD(p.date) + '</td><td><div class="row">' + av(c.name, 'sm') + '<span style="white-space:nowrap">' + esc(c.name) + '</span></div></td>' +
        '<td class="hide-sm muted">' + esc(p.note || '—') + '</td><td><span class="row" style="gap:7px;white-space:nowrap"><i style="width:7px;height:7px;border-radius:50%;background:' + (METHOD_C[p.method] || 'var(--text-3)') + '"></i>' + esc(p.method || '—') + '</span></td><td class="r num" style="font-weight:600">' + EUR2.format(p.amount) + '</td></tr>'; }).join('')
        : '<tr><td colspan="5">' + empty('euro', 'Καμία κίνηση', '') + '</td></tr>') +
      '</tbody></table></div></section>';
}

        '<label class="f full"><span>Όνομα γραφείου</span><input class="in" type="text" id="set-name" value="' + esc(s.practiceName) + '"></label>' +
        '<label class="f"><span>Συνεδρία (€)</span><input class="in" type="number" id="set-price" value="' + esc(s.sessionPrice) + '"></label>' +

        '<div><b>Πακέτα</b> <span class="muted">— κάθε ολοκληρωμένη συνεδρία ή μη προσέλευση αφαιρεί μία από το ενεργό πακέτο. Όσοι δεν έχουν πακέτο χρεώνονται ανά συνεδρία.</span></div>' +
        '<div class="faint" style="font-size:12px;padding-top:8px;border-top:1px solid var(--line)">Εκτιμήσεις για χρήση από επαγγελματία υγείας· δεν αντικαθιστούν την κλινική κρίση.</div>' +

    '<div class="s-5 col" style="gap:16px">' +
      '<section class="card"><div class="card-h"><h3>Δεδομένα</h3></div><div class="card-b col" style="gap:0">' +
        [['Πελάτες', S.clients.length], ['Μετρήσεις', S.measurements.length], ['Ραντεβού', S.appointments.length], ['Πακέτα', S.packages.length], ['Πληρωμές', S.payments.length], ['Έξοδα', S.expenses.length]].map(r => '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="muted">' + r[0] + '</span><span class="spacer"></span><b class="num">' + r[1] + '</b></div>').join('') +
        '<p class="faint" style="font-size:12px;margin-top:12px">' + (S.db ? 'Αποθηκεύεται στη βάση του artifact, ορατή μόνο στον οργανισμό σας. Οι αλλαγές συγχρονίζονται ζωντανά σε κάθε ανοιχτή καρτέλα.' : 'Αυτή η προβολή δεν έχει πρόσβαση στη βάση — οι αλλαγές δεν αποθηκεύονται.') + '</p>' +

        '<p class="muted" style="font-size:13px">' + demo + ' από τους πελάτες είναι δείγμα, για να δείτε την εφαρμογή γεμάτη. Διαγράψτε τα πριν περάσετε πραγματικούς πελάτες.</p>' +

      '<section class="card"><div class="card-h"><h3>Συντομεύσεις</h3></div><div class="card-b col" style="gap:9px;font-size:13px">' +

      '</div></section>' +

}
function presetRow(p, i){
  return '<div class="row preset" data-i="' + i + '" style="gap:8px"><input class="in" type="text" data-k="name" value="' + esc(p.name) + '" aria-label="Όνομα πακέτου" style="flex:2">' +
    '<input class="in" type="number" data-k="sessions" value="' + esc(p.sessions) + '" aria-label="Συνεδρίες" style="width:84px">' +
    '<input class="in" type="number" data-k="price" value="' + esc(p.price) + '" aria-label="Τιμή" style="width:96px">' +
    '<button class="btn ghost icon" data-act="preset-del" data-i="' + i + '" aria-label="Αφαίρεση">' + ic('x') + '</button></div>';
}

/* ---------------- render ---------------- */
function render(){
  if(dirty) reindex();
  renderSide(); renderTop();
  const el = $('#view');
  if(S.loading){
    el.innerHTML = '<div class="skel" style="height:70px;width:340px;margin-bottom:22px;border:0;background-color:transparent"></div><div class="grid g-4" style="margin-bottom:16px">' + '<div class="skel" style="height:124px"></div>'.repeat(4) + '</div><div class="grid g-12"><div class="skel s-7" style="height:360px"></div><div class="skel s-5" style="height:360px"></div></div>';
    return;
  }
  const V = {today:vToday, clients:vClients, client:vClient, calendar:vCalendar, finance:vFinance, expenses:vExpenses, reports:vReports, settings:vSettings};
  let html = (FIN_VIEWS.indexOf(S.view) >= 0 && finLocked()) ? lockScreen() : (V[S.view] || vToday)();
  if(!S.db) html = '<div class="banner">' + ic('alert') + '<span>Η βάση δεδομένων δεν είναι διαθέσιμη σε αυτή την προβολή. Ανοίξτε το artifact από το claude.ai για να δείτε και να αποθηκεύσετε δεδομένα.</span></div>' + html;
  else if(!S.canWrite) html = '<div class="banner">' + ic('alert') + '<span>Προβολή μόνο για ανάγνωση — δεν μπορείτε να κάνετε αλλαγές.</span></div>' + html;
  const focus = document.activeElement && document.activeElement.id;
  const sel = focus && document.activeElement.selectionStart;
  el.innerHTML = html;
  if(focus && (focus === 'cq' || focus === 'payq' || focus === 'expq' || focus === 'pinin')){ const f = $('#' + focus); if(f){ f.focus(); try{ f.setSelectionRange(sel, sel); }catch(e){} } }
}

/* ---------------- PIN lock ---------------- */

    '<div class="e-ico" style="width:54px;height:54px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,196,107,.25)">' + ic('lock', 'width="24" height="24"') + '</div>' +
    '<h2 style="font-size:20px;font-weight:700;letter-spacing:-.02em">Τα οικονομικά είναι κλειδωμένα</h2>' +
    '<p class="muted" style="margin:6px 0 20px;font-size:13.5px">Πληκτρολογήστε το PIN για να δείτε έσοδα, έξοδα και αναφορές.</p>' +
    '<form data-form="unlock" class="col" style="gap:12px;align-items:center"><input class="in mono" id="pinin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="• • • • • •" aria-label="PIN οικονομικών" style="max-width:220px;text-align:center;font-size:20px;letter-spacing:.35em;height:48px">' +
    '<button class="btn pri" type="submit" style="width:220px;height:40px">' + ic('unlock') + 'Ξεκλείδωμα</button></form>' +
    '<p class="faint" style="font-size:11.5px;margin-top:16px">Το ξεκλείδωμα ισχύει μέχρι να κλείσετε τη σελίδα.</p></div></section>';
}
function lockedMini(){ return '<div class="empty" style="padding:56px 20px"><div class="e-ico" style="color:var(--amber)">' + ic('lock') + '</div><b>Κλειδωμένο</b><button class="btn sm" data-act="go" data-v="reports" style="margin-top:10px">Ξεκλείδωμα</button></div>'; }

/* ---------------- Έξοδα ---------------- */

  const fixed = sum(S.expenses.filter(e => e.recurring && String(e.date).slice(0, 7) === m12[10].key), e => e.amount);
  const byC = {}; ytdL.forEach(e => { const k = e.category || 'Άλλο'; byC[k] = (byC[k] || 0) + (+e.amount || 0); });

  const rows = all.filter(e => (S.expFilter === 'all' || e.category === S.expFilter) && (!q || [e.vendor, e.note, e.category, e.method].join(' ').toLowerCase().includes(q)));
  const counts = {}; all.forEach(e => counts[e.category] = (counts[e.category] || 0) + 1);
  const chips = [['all', 'Όλα', all.length]].concat(EXP_CATS.filter(k => counts[k]).map(k => [k, k, counts[k]]));
  const pendingFixed = (() => { const prevKey = m12[10].key, curKey = m12[11].key; const have = new Set(S.expenses.filter(e => String(e.date).slice(0, 7) === curKey).map(e => (e.category + '|' + (e.vendor || '')).toLowerCase())); return S.expenses.filter(e => e.recurring && String(e.date).slice(0, 7) === prevKey && !have.has((e.category + '|' + (e.vendor || '')).toLowerCase())); })();

  return (pendingFixed.length && S.canWrite ? '<div class="banner" style="background:var(--sky-dim);border-color:rgba(111,203,255,.25);color:var(--sky)">' + ic('receipt') + '<span style="flex:1">' + pendingFixed.length + ' πάγια έξοδα του ' + MONG[(cur.getMonth() + 11) % 12] + ' δεν έχουν καταχωριστεί ακόμη για τον ' + MONN[cur.getMonth()].toLowerCase() + ' (' + EUR.format(sum(pendingFixed, e => e.amount)) + ').</span><button class="btn sm" data-act="exp-recurring">Καταχώριση</button></div>' : '') +
    '<div class="grid g-4" style="margin-bottom:16px">' +
      kpi('Έξοδα ' + MONG[cur.getMonth()], EUR.format(mE), '', dE == null ? '' : '<span class="delta ' + (dE <= 0 ? 'up' : 'down') + '">' + (dE >= 0 ? '▲' : '▼') + ' ' + Math.abs(dE) + '%</span> από ' + MON[(cur.getMonth() + 11) % 12], spark(m12.slice(-6).map(m => m.v), '#FF7A93'), 'receipt', 'rose') +
      kpi('Έξοδα ' + yr, EUR.format(ytd), '', ytdL.length + ' κινήσεις από 1 Ιανουαρίου', '', 'trend', 'amber') +
      kpi('Πάγια μηνιαία', EUR.format(fixed), '', 'ενοίκιο, εισφορές, λογιστής κ.ά.', '', 'cal', 'sky') +
      kpi('Μεγαλύτερη κατηγορία', cats[0] || '—', '', cats[0] ? EUR.format(byC[cats[0]]) + ' · ' + Math.round(byC[cats[0]] / (ytd || 1) * 100) + '% του έτους' : '', '', 'pie', 'violet') +
    '</div>' +
    '<div class="grid g-12" style="margin-bottom:16px">' +
      '<section class="card s-8"><div class="card-h"><h3>Έξοδα ανά μήνα</h3><span class="sub">' + EUR.format(sum(m12, m => m.v)) + ' σε 12 μήνες</span></div><div class="card-b">' +
        bars(m12.map(m => ({l:m.l, v:m.v, tip:MONN[m.m] + ' ' + m.y + '|' + EUR.format(m.v)})), {color:'#FF7A93', fmtY:v => kfmt(v), label:'Έξοδα ανά μήνα', h:250}) + '</div></section>' +
      '<section class="card s-4"><div class="card-h"><h3>Κατανομή ' + yr + '</h3></div><div class="card-b">' +
        '<div class="row" style="justify-content:center;margin:2px 0 16px">' + donut(cats.map(k => ({v:byC[k], color:expCol(k), l:k})), 138, '<div><div style="font-size:18px;font-weight:750;letter-spacing:-.02em">' + EUR.format(ytd) + '</div><div class="eyebrow" style="font-size:9px">σύνολο</div></div>') + '</div>' +
        '<div class="col" style="gap:8px">' + cats.slice(0, 7).map(k => '<div class="row" style="font-size:12.5px;cursor:pointer" data-act="exp-filter" data-c="' + esc(k) + '"><i style="width:8px;height:8px;border-radius:3px;background:' + expCol(k) + '"></i><span class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(k) + '</span><span class="spacer"></span><b class="num">' + EUR.format(byC[k]) + '</b><span class="faint mono" style="width:36px;text-align:end;font-size:11px">' + Math.round(byC[k] / (ytd || 1) * 100) + '%</span></div>').join('') + '</div>' +

      '<div class="filters" style="padding:12px 18px 0">' + chips.map(ch => '<button class="fchip" data-act="exp-filter" data-c="' + esc(ch[0]) + '" aria-pressed="' + (S.expFilter === ch[0]) + '">' + (ch[0] !== 'all' ? '<i style="width:7px;height:7px;border-radius:50%;background:' + expCol(ch[0]) + '"></i>' : '') + esc(ch[1]) + '<span class="n">' + ch[2] + '</span></button>').join('') + '</div>' +

      '</tbody></table></div>' + (rows.length > 50 ? '<p class="faint" style="font-size:12px;padding:10px 18px 14px">Εμφανίζονται οι 50 πιο πρόσφατες — χρησιμοποιήστε φίλτρο ή αναζήτηση.</p>' : '') + '</section>';
}

/* ---------------- Αναφορές & κερδοφορία ---------------- */
const RANGES = [['month','Μήνας'],['3m','3 μήνες'],['ytd','Φέτος'],['12','12 μήνες']];
function repMonths(key){
  const cur = P(today());
  const n = key === 'month' ? 1 : key === '3m' ? 3 : key === 'ytd' ? cur.getMonth() + 1 : 12;
  const all = monthsBack(n * 2);
  return {cur:all.slice(n), prev:all.slice(0, n), n};
}
function repData(months){
  const inc = revenueBy(months), exp = expensesBy(months);
  return months.map((m, i) => {
    const ap = S.appointments.filter(a => String(a.date).slice(0, 7) === m.key);
    return {key:m.key, l:m.l, tipL:MONN[m.m] + ' ' + m.y, inc:inc[i].v, exp:exp[i].v,
      done:ap.filter(a => a.status === 'done').length, newc:S.clients.filter(c => String(c.startDate).slice(0, 7) === m.key).length};
  });
}
function paySource(p){ if(!p.packageId) return 'Μεμονωμένες συνεδρίες'; const pk = S.packages.find(k => k.id === p.packageId); return pk && /online/i.test(pk.name) ? 'Online προγράμματα' : 'Πακέτα συνεδριών'; }
function repLabel(){ const r = repMonths(S.repRange); const a = r.cur[0], b = r.cur[r.cur.length - 1]; return r.n === 1 ? MONN[a.m] + ' ' + a.y : a.l + (a.y !== b.y ? ' ' + a.y : '') + ' – ' + b.l + ' ' + b.y; }
function vReports(){
  const t = today(), r = repMonths(S.repRange);
  const rows = repData(r.cur), prow = repData(r.prev);
  const I = sum(rows, x => x.inc), E = sum(rows, x => x.exp), Pf = I - E, M = I ? Pf / I : 0;
  const pI = sum(prow, x => x.inc), pE = sum(prow, x => x.exp), pP = pI - pE;
  const cover = prow.every(x => x.inc > 0 || x.exp > 0);
  const dl = (a, b, invert) => { if(!b || !cover) return r.n === 1 ? '' : 'πρώτη περίοδος λειτουργίας'; const d = Math.round((a - b) / Math.abs(b) * 100); const good = invert ? d <= 0 : d >= 0; return '<span class="delta ' + (good ? 'up' : 'down') + '">' + (d >= 0 ? '▲' : '▼') + ' ' + Math.abs(d) + '%</span> vs προηγ.'; };
  const from = r.cur[0].key + '-01';
  const pays_ = payIn(from, t), exps_ = expIn(from, t);
  const src = {}; pays_.forEach(p => { const k = paySource(p); src[k] = (src[k] || 0) + (+p.amount || 0); });
  const srcK = Object.keys(src).sort((a, b) => src[b] - src[a]);
  const SRC_C = {'Πακέτα συνεδριών':'#5CF0B0', 'Μεμονωμένες συνεδρίες':'#6FCBFF', 'Online προγράμματα':'#FFC46B'};
  const byC = {}; exps_.forEach(e => { const k = e.category || 'Άλλο'; byC[k] = (byC[k] || 0) + (+e.amount || 0); });
  const catK = Object.keys(byC).sort((a, b) => byC[b] - byC[a]);
  const byCl = {}; pays_.forEach(p => byCl[p.clientId] = (byCl[p.clientId] || 0) + (+p.amount || 0));
  const topCl = Object.keys(byCl).sort((a, b) => byCl[b] - byCl[a]).slice(0, 8);
  const topMax = topCl.length ? byCl[topCl[0]] : 1;
  // operations — last 30 days
  const d30 = addD(t, -30);
  const ap30 = S.appointments.filter(a => a.date > d30 && a.date <= t);
  const done30 = ap30.filter(a => a.status === 'done').length, ns30 = ap30.filter(a => a.status === 'noshow').length, cx30 = ap30.filter(a => a.status === 'cancelled').length;
  const inc30 = sum(payIn(addD(d30, 1), t), p => p.amount), exp30 = sum(expIn(addD(d30, 1), t), e => e.amount);
  const perS = done30 ? inc30 / done30 : 0;
  const prevKey = monthsBack(2)[0].key;
  const fixedM = sum(S.expenses.filter(e => e.recurring && String(e.date).slice(0, 7) === prevKey), e => e.amount);
  const be = perS ? Math.ceil(fixedM / perS) : null;
  const doneMonth = S.appointments.filter(a => a.status === 'done' && String(a.date).slice(0, 7) === t.slice(0, 7)).length;
  const op = (l, v, m, color) => '<div style="padding:14px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.015)"><div class="eyebrow" style="font-size:9.5px">' + esc(l) + '</div><div style="font-size:21px;font-weight:700;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums;color:' + (color || 'var(--text)') + '">' + esc(v) + '</div><div class="faint" style="font-size:11.5px;margin-top:1px">' + m + '</div></div>';
  const hbar = (label, v, tot, color, extra) => '<div><div class="row" style="font-size:12.5px;gap:8px"><i style="width:8px;height:8px;border-radius:3px;background:' + color + '"></i><span class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(label) + '</span><span class="spacer"></span><b class="num">' + EUR.format(v) + '</b><span class="faint mono" style="width:38px;text-align:end;font-size:11px">' + Math.round(v / (tot || 1) * 100) + '%</span></div><div style="margin-top:6px">' + pbar(v / (tot || 1), color) + '</div>' + (extra || '') + '</div>';

  return '<div class="row wrap" style="margin-bottom:16px;gap:10px"><div class="seg">' + RANGES.map(x => '<button data-act="rep-range" data-r="' + x[0] + '" aria-pressed="' + (S.repRange === x[0]) + '">' + x[1] + '</button>').join('') + '</div>' +
      '<h2 style="font-size:17px;font-weight:700;letter-spacing:-.02em">' + esc(repLabel()) + '</h2><span class="spacer"></span><span class="faint" style="font-size:12px">ταμειακή βάση · εισπράξεις − έξοδα</span></div>' +
    '<div class="grid g-4" style="margin-bottom:16px">' +
      kpi('Έσοδα', EUR.format(I), '', dl(I, pI), spark(rows.map(x => x.inc), '#5CF0B0'), 'euro', 'mint') +
      kpi('Έξοδα', EUR.format(E), '', dl(E, pE, true), spark(rows.map(x => x.exp), '#FF7A93'), 'receipt', 'rose') +
      kpi('Καθαρό κέρδος', EUR.format(Pf), '', dl(Pf, pP), spark(rows.map(x => x.inc - x.exp), '#FFC46B'), 'trend', Pf >= 0 ? 'amber' : 'rose') +
      kpi('Περιθώριο κέρδους', I ? Math.round(M * 100) + '%' : '—', '', 'κέρδος ανά €100 εσόδων: ' + (I ? EUR.format(M * 100) : '—'), '', 'pie', 'violet') +
    '</div>' +
    (r.n > 1 ? '<section class="card" style="margin-bottom:16px"><div class="card-h"><h3>Έσοδα, έξοδα & κέρδος</h3><span class="spacer"></span>' + pnlLegend() + '</div><div class="card-b">' + pnl(rows, {h:270}) + '</div></section>' : '') +
    '<div class="grid g-12" style="margin-bottom:16px">' +
      '<section class="card s-4"><div class="card-h"><h3>Πηγές εσόδων</h3></div><div class="card-b col" style="gap:14px">' +
        (srcK.length ? srcK.map(k => hbar(k, src[k], I, SRC_C[k] || '#A394FF')).join('') : '<span class="faint">Καμία είσπραξη στο διάστημα.</span>') + '</div></section>' +
      '<section class="card s-4"><div class="card-h"><h3>Έξοδα ανά κατηγορία</h3></div><div class="card-b col" style="gap:12px">' +
        (catK.length ? catK.slice(0, 7).map(k => hbar(k, byC[k], E, expCol(k))).join('') + (catK.length > 7 ? '<span class="faint" style="font-size:12px">+ ' + (catK.length - 7) + ' ακόμη κατηγορίες · ' + EUR.format(sum(catK.slice(7), k => byC[k])) + '</span>' : '') : '<span class="faint">Κανένα έξοδο στο διάστημα.</span>') + '</div></section>' +
      '<section class="card s-4"><div class="card-h"><h3>Κορυφαίοι πελάτες</h3><span class="sub">εισπράξεις</span></div><div class="card-b col" style="gap:11px">' +
        (topCl.length ? topCl.map(id => { const c = client(id) || {name:'—'}; return '<div class="row" data-act="open" data-id="' + id + '" style="cursor:pointer;gap:10px">' + av(c.name, 'sm') + '<div style="flex:1;min-width:0"><div class="row" style="font-size:12.5px;gap:6px"><b style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(c.name) + '</b><span class="spacer"></span><span class="num" style="font-weight:600">' + EUR.format(byCl[id]) + '</span></div><div style="margin-top:5px">' + pbar(byCl[id] / topMax, 'var(--violet)') + '</div></div></div>'; }).join('') : '<span class="faint">—</span>') + '</div></section>' +
    '</div>' +
    '<section class="card" style="margin-bottom:16px"><div class="card-h"><h3>Λειτουργία γραφείου</h3><span class="sub">τελευταίες 30 ημέρες</span></div><div class="card-b"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
      op('Συνεδρίες', done30, 'ολοκληρωμένες') +
      op('Έσοδο / συνεδρία', perS ? EUR.format(perS) : '—', 'εισπράξεις ÷ συνεδρίες') +
      op('Κόστος / συνεδρία', done30 ? EUR.format(exp30 / done30) : '—', 'έξοδα ÷ συνεδρίες') +
      op('Μη προσέλευση', ap30.length ? Math.round(ns30 / Math.max(1, done30 + ns30) * 100) + '%' : '—', ns30 + ' ραντεβού', ns30 / Math.max(1, done30 + ns30) > .08 ? 'var(--rose)' : '') +
      op('Ακυρώσεις', ap30.length ? Math.round(cx30 / ap30.length * 100) + '%' : '—', cx30 + ' ραντεβού') +
      op('Νεκρό σημείο', be != null ? be + ' συν.' : '—', 'τον μήνα για τα πάγια (' + EUR.format(fixedM) + ')' + (be != null ? ' · φέτος τον μήνα: ' + doneMonth : ''), be != null && doneMonth >= be ? 'var(--mint)' : '') +
    '</div></div></section>' +
    '<section class="card"><div class="card-h"><h3>Αποτελέσματα ανά μήνα</h3><span class="spacer"></span>' + (S.dl ? '<button class="btn sm" data-act="rep-csv">' + ic('down') + 'CSV για λογιστή</button>' : '') + '</div>' +
      '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Μήνας</th><th class="r">Έσοδα</th><th class="r">Έξοδα</th><th class="r">Κέρδος</th><th class="r">Περιθώριο</th><th class="r hide-sm">Νέοι πελάτες</th></tr></thead><tbody>' +
      rows.slice().reverse().map(x => { const p = x.inc - x.exp; return '<tr><td style="white-space:nowrap"><b style="font-weight:600">' + esc(x.tipL) + '</b></td><td class="r num">' + EUR.format(x.inc) + '</td><td class="r num" style="color:var(--rose)">' + EUR.format(x.exp) + '</td>' +
        '<td class="r num" style="font-weight:650;color:' + (p >= 0 ? 'var(--mint)' : 'var(--rose)') + '">' + (p < 0 ? '−' : '') + EUR.format(Math.abs(p)) + '</td><td class="r num">' + (x.inc ? Math.round(p / x.inc * 100) + '%' : '—') + '</td><td class="r num hide-sm">' + x.newc + '</td></tr>'; }).join('') +
      (rows.length > 1 ? '<tr style="background:rgba(255,255,255,.025)"><td><b>Σύνολο</b></td><td class="r num"><b>' + EUR.format(I) + '</b></td><td class="r num" style="color:var(--rose)"><b>' + EUR.format(E) + '</b></td><td class="r num" style="color:' + (Pf >= 0 ? 'var(--mint)' : 'var(--rose)') + '"><b>' + (Pf < 0 ? '−' : '') + EUR.format(Math.abs(Pf)) + '</b></td><td class="r num"><b>' + (I ? Math.round(M * 100) + '%' : '—') + '</b></td><td class="r num hide-sm"><b>' + sum(rows, x => x.newc) + '</b></td></tr>' : '') +
      '</tbody></table></div></section>';
}
function reportCsv(){

  let out = '﻿' + q(cfg().practiceName + ' — Αναφορά ' + repLabel()) + '\r\n\r\n';
  out += ['Μήνας', 'Έσοδα', 'Έξοδα', 'Κέρδος', 'Περιθώριο %'].map(q).join(';') + '\r\n';
  rows.forEach(x => { out += [q(x.tipL), f(x.inc), f(x.exp), f(x.inc - x.exp), x.inc ? Math.round((x.inc - x.exp) / x.inc * 100) : ''].join(';') + '\r\n'; });
  const I = sum(rows, x => x.inc), E = sum(rows, x => x.exp);
  out += [q('Σύνολο'), f(I), f(E), f(I - E), I ? Math.round((I - E) / I * 100) : ''].join(';') + '\r\n\r\n';
  out += [q('Ημερομηνία'), q('Κατηγορία'), q('Περιγραφή'), q('Τρόπος'), q('Ποσό')].join(';') + '\r\n';
  expIn(r.cur[0].key + '-01', t).sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => { out += [q(e.date), q(e.category || ''), q(e.vendor || ''), q(e.method || ''), f(e.amount)].join(';') + '\r\n'; });
  out += '\r\n' + [q('Ημερομηνία'), q('Πελάτης'), q('Περιγραφή'), q('Τρόπος'), q('Ποσό')].join(';') + '\r\n';
  payIn(r.cur[0].key + '-01', t).sort((a, b) => a.date < b.date ? -1 : 1).forEach(p => { out += [q(p.date), q((client(p.clientId) || {}).name || ''), q(p.note || ''), q(p.method || ''), f(p.amount)].join(';') + '\r\n'; });
  return out;
}

  const p0 = pr[0] || {name:'Πακέτο', sessions:4, price:160};
  const body = '<div class="fields">' +
    fl('Πελάτης', clientSelect(cid), 'full') +
    fl('Πακέτο', '<select class="in" name="preset">' + pr.map((p, i) => '<option value="' + i + '">' + esc(p.name) + ' — ' + EUR.format(p.price) + '</option>').join('') + '<option value="-1">Προσαρμοσμένο…</option></select>', 'full') +
    fl('Όνομα', '<input class="in" type="text" name="name" value="' + esc(p0.name) + '">', 'full') +
    fl('Συνεδρίες', '<input class="in" type="number" name="sessions" value="' + p0.sessions + '">') +
    fl('Τιμή (€)', '<input class="in" type="number" name="price" value="' + p0.price + '">') +
    fl('Ημερομηνία έναρξης', '<input class="in" type="date" name="startDate" value="' + today() + '">') +
    fl('Ήδη χρησιμοποιημένες', '<input class="in" type="number" name="usedOffset" value="0" min="0">', '', 'για μεταφορά από άλλο σύστημα') +
    '<div class="sect">Πληρωμή</div>' +
    '<label class="row full" style="gap:10px;cursor:pointer"><input type="checkbox" name="payNow" checked style="accent-color:#5CF0B0;width:16px;height:16px"><span>Καταχώριση πληρωμής τώρα</span></label>' +
    fl('Ποσό (€)', '<input class="in" type="number" name="amount" value="' + p0.price + '">') +
    fl('Τρόπος', '<select class="in" name="method">' + METHODS.map(m => '<option>' + m + '</option>').join('') + '</select>') +
  '</div>';
  OV = 'pkg';
  sheet('Νέο πακέτο', body, '<span class="spacer"></span><button class="btn" data-act="close">Άκυρο</button><button class="btn pri" data-act="save-pkg">Δημιουργία πακέτου</button>', 'md', 'Οι κλεισμένες συνεδρίες χωρίς πακέτο συνδέονται αυτόματα');
}
function savePkg(){
  const f = form();
  if(!need(f.clientId, 'Επιλέξτε πελάτη.') || !need(numOr(f.sessions, 0) > 0, 'Ορίστε αριθμό συνεδριών.')) return;
  const id = uid(), ses = numOr(f.sessions, 0);
  put('packages', id, {clientId:f.clientId, name:f.name || 'Πακέτο', sessions:ses, price:numOr(f.price, 0), startDate:f.startDate || today(), usedOffset:numOr(f.usedOffset, 0), demo:false});
  if(f.payNow && numOr(f.amount, 0) > 0) put('payments', uid(), {clientId:f.clientId, date:f.startDate || today(), amount:numOr(f.amount, 0), method:f.method, note:f.name, packageId:id, demo:false});
  let room = ses - numOr(f.usedOffset, 0);
  appts(f.clientId).filter(a => a.status === 'scheduled' && !a.packageId && a.date >= (f.startDate || today())).forEach(a => { if(room-- > 0) patch('appointments', a.id, {packageId:id, fee:null}); });
  closeOv(); toast('Το πακέτο δημιουργήθηκε', 'box');
}

/* ---------------- payment ---------------- */
function mPay(cid){
  const body = '<div class="fields">' +
    fl('Πελάτης', clientSelect(cid), 'full') +
    '<div class="full" id="pbal"></div>' +
    fl('Ποσό (€)', '<input class="in" type="number" step="0.5" name="amount" autofocus>') +
    fl('Ημερομηνία', '<input class="in" type="date" name="date" value="' + today() + '">') +
    fl('Τρόπος', '<select class="in" name="method">' + METHODS.map(m => '<option>' + m + '</option>').join('') + '</select>') +
    fl('Περιγραφή', '<input class="in" type="text" name="note" placeholder="π.χ. 2η δόση πακέτου">') +
  '</div>';
  OV = 'pay';
  sheet('Νέα πληρωμή', body, '<span class="spacer"></span><button class="btn" data-act="close">Άκυρο</button><button class="btn pri" data-act="save-pay">Καταχώριση</button>', '');
  payBal(true);
}
function payBal(fill){
  const el = $('#pbal'); if(!el) return;
  const f = form(), c = client(f.clientId);
  if(!c){ el.innerHTML = ''; return; }
  const b = balance(c.id);
  el.innerHTML = '<div class="preview" style="background:' + (b > 0 ? 'var(--rose-dim);border-color:rgba(255,122,147,.22)' : '') + '"><div><span>Υπόλοιπο</span><b style="color:' + (b > 0 ? 'var(--rose)' : 'var(--mint)') + '">' + (b > 0 ? EUR2.format(b) + ' οφειλή' : b < 0 ? EUR2.format(-b) + ' προκαταβολή' : 'Εξοφλημένο') + '</b></div>' +
    '<div><span>Χρεώσεις</span><b>' + EUR.format(charges(c.id)) + '</b></div><div><span>Πληρωμές</span><b>' + EUR.format(paid(c.id)) + '</b></div></div>';
  const am = $('#ov [name="amount"]');
  if(fill && am && b > 0) am.value = b;
}
function savePay(){
  const f = form();
  if(!need(f.clientId, 'Επιλέξτε πελάτη.') || !need(numOr(f.amount, 0) > 0, 'Συμπληρώστε ποσό.')) return;
  put('payments', uid(), {clientId:f.clientId, date:f.date || today(), amount:numOr(f.amount, 0), method:f.method, note:f.note, packageId:null, demo:false});
  closeOv(); toast('Πληρωμή ' + EUR2.format(numOr(f.amount, 0)) + ' καταχωρίστηκε', 'euro');
}

/* ---------------- plan builder ---------------- */
function mPlan(plan, cid){
  S.draft = plan ? JSON.parse(JSON.stringify(plan)) : {id:uid(), clientId:cid || '', title:'Διατροφικό πλάνο', date:today(), targetKcal:null, meals:MEALS.map(n => ({name:n, items:[]})), notes:'', isTemplate:false, _new:true};
  if(!S.draft.meals || !S.draft.meals.length) S.draft.meals = MEALS.map(n => ({name:n, items:[]}));
  if(!plan && cid){ const c = client(cid), lm = lastM(cid); const k = c && lm ? targetK(c, lm.weight) : null; if(k) S.draft.targetKcal = k; }
  S.activeMeal = 0; S.foodQ = ''; S.foodCat = 'all';
  OV = 'plan';
  renderPlan();
}
function renderPlan(){
  const d = S.draft; if(!d) return;
  const scr = $('#ov .scrim'), top = scr ? scr.scrollTop : 0;
  const tpls = S.plans.filter(p => p.isTemplate);
  const c = client(d.clientId), lm = c ? lastM(c.id) : null, sug = c && lm ? targetK(c, lm.weight) : null;
  const body = '<div class="fields" style="grid-template-columns:1.3fr 1.3fr .8fr .8fr">' +
      fl('Πελάτης', clientSelect(d.clientId, 'clientId', true)) +
      fl('Τίτλος', '<input class="in" type="text" name="title" value="' + esc(d.title) + '">') +
      fl('Ημερομηνία', '<input class="in" type="date" name="date" value="' + esc(d.date) + '">') +
      fl('Στόχος kcal', '<input class="in" type="number" step="10" name="targetKcal" value="' + esc(d.targetKcal || '') + '" placeholder="' + (sug || 1800) + '">', '', sug && Number(d.targetKcal) !== sug ? '<a href="#" data-act="pb-sug" data-v="' + sug + '" style="color:var(--mint)">υπολογισμένος: ' + sug + '</a>' : '') +
    '</div>' +
    (d._new && tpls.length ? '<div class="row wrap" style="gap:6px"><span class="faint" style="font-size:12.5px;margin-inline-end:4px">Ξεκινήστε από πρότυπο:</span>' + tpls.map(t => '<button class="btn sm" data-act="pb-tpl" data-id="' + t.id + '">' + ic('file') + esc(t.title) + '</button>').join('') + '</div>' : '') +
    '<div class="pb"><div class="col" style="gap:12px" id="pb-meals">' + d.meals.map((m, mi) => mealBlock(m, mi)).join('') +
      '<label class="f"><span>Οδηγίες προς τον πελάτη</span><textarea class="in" name="notes" placeholder="Νερό, αλκοόλ, ελεύθερο γεύμα, συμπληρώματα…">' + esc(d.notes || '') + '</textarea></label></div>' +
    '<div class="pb-side"><section class="card" id="pb-sum">' + planSummary() + '</section>' +
      '<section class="card"><div class="card-h"><h3>Βάση τροφίμων</h3><span class="sub">προσθήκη σε: <b style="color:var(--mint)">' + esc((d.meals[S.activeMeal] || {}).name || '') + '</b></span></div><div class="card-b col" style="gap:10px">' +
        '<label class="search" style="min-width:0">' + ic('search') + '<input id="fq" type="text" placeholder="Αναζήτηση τροφίμου…" value="' + esc(S.foodQ) + '" autocomplete="off" aria-label="Αναζήτηση τροφίμου"></label>' +
        '<div class="cats">' + Object.keys(CATS).map(k => '<button data-act="pb-cat" data-c="' + k + '" aria-pressed="' + (S.foodCat === k) + '">' + CATS[k] + '</button>').join('') + '</div>' +
        '<div class="food-list" id="flist">' + foodList() + '</div>' +
      '</div></section></div></div>';
  const isNew = d._new;
  $('#ov').innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet wide" role="dialog" aria-modal="true" aria-label="Διατροφικό πλάνο">' +
    '<div class="sheet-h"><div style="flex:1;min-width:0"><h3>' + (d.isTemplate ? 'Πρότυπο πλάνο' : isNew ? 'Νέο διατροφικό πλάνο' : 'Διατροφικό πλάνο') + '</h3><div class="faint" style="font-size:12.5px;margin-top:2px">' + (c ? esc(c.name) + (lm ? ' · ' + N1.format(lm.weight) + ' kg' : '') + ' · ' + esc(c.goal || '') : d.isTemplate ? 'Χωρίς πελάτη' : 'Επιλέξτε πελάτη') + '</div></div><button class="btn ghost icon" data-act="close" aria-label="Κλείσιμο">' + ic('x') + '</button></div>' +
    '<div class="sheet-b">' + body + '</div>' +
    '<div class="sheet-f"><button class="btn" data-act="pb-copy">' + ic('copy') + '<span class="hide-sm">Αντιγραφή κειμένου</span></button>' + (S.dl ? '<button class="btn" data-act="pb-dl">' + ic('down') + '<span class="hide-sm">Λήψη για τον πελάτη</span></button>' : '') +
      (!isNew && S.canWrite ? '<button class="btn danger" data-act="pb-del-plan" data-step="0">' + ic('trash') + '</button>' : '') +
      '<span class="spacer"></span>' + (S.canWrite ? (d.isTemplate ? '' : '<button class="btn" data-act="pb-save-tpl">Αποθήκευση ως πρότυπο</button>') + '<button class="btn pri" data-act="pb-save">' + ic('check') + 'Αποθήκευση</button>' : '') + '</div>' +
    '</div></div>';
  const s = $('#ov .scrim'); if(s) s.scrollTop = top;
}
function mealBlock(m, mi){
  const act = mi === S.activeMeal;
  return '<div class="meal' + (act ? ' active' : '') + '"><div class="meal-h" data-act="pb-meal" data-m="' + mi + '">' +
      '<span class="chip ' + (act ? 'mint' : '') + '" style="width:24px;padding:0;justify-content:center">' + (mi + 1) + '</span><b>' + esc(m.name) + '</b>' +
      (act ? '<span class="faint" style="font-size:11.5px">· τα τρόφιμα από τη βάση μπαίνουν εδώ</span>' : '') +
      '<span class="kc" data-mk="' + mi + '">' + mealK(m) + ' kcal</span>' +
      '<button class="btn ghost sm" data-act="pb-custom" data-m="' + mi + '" title="Προσαρμοσμένο τρόφιμο">' + ic('plus') + '<span class="hide-sm">Δικό σας</span></button></div>' +
    ((m.items || []).length ? '<div class="it head"><span>Τρόφιμο</span><span style="text-align:end">Ποσότητα</span><span style="text-align:end">kcal</span><span style="text-align:end">Π</span><span style="text-align:end">Υ</span><span style="text-align:end">Λ</span><span></span></div>' : '') +
    (m.items || []).map((it, ii) => itemRow(it, mi, ii)).join('') +
    (!(m.items || []).length ? '<div class="faint" style="padding:4px 14px 14px;font-size:12.5px">' + (act ? 'Επιλέξτε τρόφιμα από τη βάση δεξιά.' : 'Κενό — πατήστε για να προσθέσετε τρόφιμα.') + '</div>' : '') +
  '</div>';
}
function itemRow(it, mi, ii){
  const k = mi + ':' + ii;
  if(!it.base){
    return '<div class="it" data-row="' + k + '"><span class="fn"><input class="mini-in" style="text-align:start;font-family:var(--sans)" data-cf="' + k + ':food" value="' + esc(it.food || '') + '" placeholder="Τρόφιμο"></span>' +
      '<label class="qty"><input type="text" data-cf="' + k + ':qtyText" value="' + esc(it.qtyText || '') + '" placeholder="1 μερίδα" style="text-align:start;font-family:var(--sans)"></label>' +
      ['kcal','p','c','f'].map(x => '<input class="mini-in" type="number" data-cf="' + k + ':' + x + '" value="' + esc(it[x] == null ? '' : it[x]) + '" aria-label="' + x + '">').join('') +
      '<button class="btn ghost sm icon" data-act="pb-rm" data-k="' + k + '" aria-label="Αφαίρεση">' + ic('x') + '</button></div>';
  }
  return '<div class="it" data-row="' + k + '"><span class="fn" title="' + esc(it.food) + '">' + esc(it.food) + '</span>' +
    '<label class="qty"><input type="number" min="0" step="' + (it.per === 1 ? '0.5' : '5') + '" data-q="' + k + '" value="' + esc(it.qty) + '" aria-label="Ποσότητα ' + esc(it.food) + '"><span>' + esc(it.unit) + '</span></label>' +
    '<span class="m" data-v="kcal">' + it.kcal + '</span><span class="m" data-v="p">' + N1.format(it.p) + '</span><span class="m" data-v="c">' + N1.format(it.c) + '</span><span class="m" data-v="f">' + N1.format(it.f) + '</span>' +
    '<button class="btn ghost sm icon" data-act="pb-rm" data-k="' + k + '" aria-label="Αφαίρεση">' + ic('x') + '</button></div>';
}
function planSummary(){
  const d = S.draft, t = planTot(d), tk = Number(d.targetKcal) || 0;
  const c = client(d.clientId), lm = c ? lastM(c.id) : null, w = lm ? lm.weight : null;
  const kp = t.p * 4, kc = t.c * 4, kf = t.f * 9, kt = kp + kc + kf || 1;
  const pct = tk ? t.k / tk : 0, dev = tk ? t.k - tk : null;
  const col = dev == null ? 'var(--mint)' : Math.abs(dev) <= 80 ? 'var(--mint)' : dev > 0 ? 'var(--amber)' : 'var(--sky)';
  return '<div class="card-b col" style="gap:14px">' +
    '<div class="row" style="align-items:flex-end"><div><div class="eyebrow">Σύνολο ημέρας</div><div style="font-size:32px;font-weight:750;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums">' + N0.format(t.k) + '<small class="faint" style="font-size:14px;font-weight:600"> kcal</small></div></div><span class="spacer"></span>' +
      (dev != null ? chip((dev > 0 ? '+' : '') + dev + ' από ' + N0.format(tk), Math.abs(dev) <= 80 ? 'mint' : 'amber') : '') + '</div>' +
    (tk ? pbar(Math.min(pct, 1), col) : '') +
    '<div class="row" style="gap:16px">' + donut([{v:kp, color:'var(--mint)', l:'Πρωτεΐνη'}, {v:kc, color:'var(--sky)', l:'Υδατάνθρακες'}, {v:kf, color:'var(--violet)', l:'Λίπος'}], 96,
        '<div class="mono" style="font-size:11px;color:var(--text-2)">P/C/F</div>') +
      '<div class="col" style="gap:7px;flex:1;font-size:12.5px">' +
        macroLine('Πρωτεΐνη', t.p, 'var(--mint)', Math.round(kp / kt * 100) + '%' + (w ? ' · ' + N1.format(t.p / w) + '/kg' : '')) +
        macroLine('Υδατάνθρακες', t.c, 'var(--sky)', Math.round(kc / kt * 100) + '%') +
        macroLine('Λίπος', t.f, 'var(--violet)', Math.round(kf / kt * 100) + '%') + '</div></div>' +
    '<div class="col" style="gap:6px;padding-top:12px;border-top:1px solid var(--line)">' + d.meals.map(m => { const k = mealK(m); return '<div class="row" style="font-size:12px"><span class="muted" style="width:98px">' + esc(m.name) + '</span><div style="flex:1">' + pbar(t.k ? k / t.k : 0, 'var(--mint)') + '</div><span class="mono faint" style="width:66px;text-align:end;font-size:11px">' + k + ' · ' + (t.k ? Math.round(k / t.k * 100) : 0) + '%</span></div>'; }).join('') + '</div>' +
  '</div>';
}
function foodList(){
  const q = S.foodQ.trim().toLowerCase();
  const list = FOODS.filter(f => (S.foodCat === 'all' || f.cat === S.foodCat) && (!q || f.n.toLowerCase().includes(q))).slice(0, 80);
  return list.length ? list.map(f => '<button class="food" data-act="pb-add" data-f="' + esc(f.n) + '"><span style="min-width:0"><b>' + esc(f.n) + '</b><span>' + f.kcal + ' kcal / ' + f.per + ' ' + esc(f.unit) + ' · Π ' + f.p + ' · Υ ' + f.c + ' · Λ ' + f.f + '</span></span><span class="plus">' + ic('plus', 'width="14" height="14"') + '</span></button>').join('')
    : '<div class="faint" style="padding:14px 6px;font-size:12.5px">Δεν βρέθηκε. Χρησιμοποιήστε «Δικό σας» στο γεύμα για προσαρμοσμένο τρόφιμο.</div>';
}
function syncPlanFields(){
  const d = S.draft; if(!d) return;
  const g = n => { const e = $('#ov [name="' + n + '"]'); return e ? e.value : undefined; };
  if(g('clientId') !== undefined) d.clientId = g('clientId');
  if(g('title') !== undefined) d.title = g('title');
  if(g('date') !== undefined) d.date = g('date');
  if(g('targetKcal') !== undefined) d.targetKcal = numOr(g('targetKcal'), null);
  if(g('notes') !== undefined) d.notes = g('notes');
}
function refreshPlanLive(mi){
  const sm = $('#pb-sum'); if(sm) sm.innerHTML = planSummary();
  const mk = $('#ov [data-mk="' + mi + '"]'); if(mk) mk.textContent = mealK(S.draft.meals[mi]) + ' kcal';
}
function planText(d){
  const c = client(d.clientId), t = planTot(d);
  let s = 'ΔΙΑΤΡΟΦΙΚΟ ΠΛΑΝΟ' + (c ? ' — ' + c.name : '') + '\n' + fmtD(d.date) + ' · ' + N0.format(t.k) + ' kcal (Π ' + t.p + ' g · Υ ' + t.c + ' g · Λ ' + t.f + ' g)\n';
  d.meals.forEach(m => { if(!(m.items || []).length) return; s += '\n' + m.name.toUpperCase() + '\n'; m.items.forEach(i => { s += '• ' + i.food + ' — ' + (i.base ? N0.format(i.qty) + ' ' + i.unit : (i.qtyText || '1 μερίδα')) + '\n'; }); });
  if(d.notes) s += '\nΟΔΗΓΙΕΣ\n' + d.notes + '\n';
  s += '\n' + cfg().practiceName;
  return s;
}

    '<div class="m"><div><b>' + N0.format(t.k) + '</b><span>kcal / ημέρα</span></div><div><b>' + t.p + ' g</b><span>πρωτεΐνη</span></div><div><b>' + t.c + ' g</b><span>υδατάνθρακες</span></div><div><b>' + t.f + ' g</b><span>λίπος</span></div></div></header>' +

}
function savePlan(asTpl){
  syncPlanFields();
  const d = S.draft;
  if(!asTpl && !d.isTemplate && !need(d.clientId, 'Επιλέξτε πελάτη ή αποθηκεύστε ως πρότυπο.')) return;
  if(!need(planTot(d).k > 0, 'Προσθέστε τουλάχιστον ένα τρόφιμο.')) return;
  const data = {clientId:asTpl ? '' : d.clientId, title:d.title || 'Διατροφικό πλάνο', date:d.date || today(), targetKcal:d.targetKcal || null,

function openPalette(){
